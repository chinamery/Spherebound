
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scrolling World</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

    <div id="viewport">

        <div id="world">

            <div class="panel photo1 left"></div>
            <div class="panel photo1 right"></div>

            <div class="panel photo2 left"></div>
            <div class="panel photo2 right"></div>

            <div class="panel photo3 left"></div>
            <div class="panel photo3 right"></div>

            <div class="panel photo4 left"></div>
            <div class="panel photo4 right"></div>

            <div class="panel photo5 left"></div>
            <div class="panel photo5 right"></div>

            <img id="character" src="images/character.png">

        </div>

        <div id="controls">
            <button id="left">◀</button>
            <button id="right">▶</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
